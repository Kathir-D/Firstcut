[[bin]]
name = "firstcut"
path = "src/main.rs"

[dependencies]
firstcut-core = { path = "../firstcut-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
