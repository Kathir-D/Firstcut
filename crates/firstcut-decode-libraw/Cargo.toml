[package]
name = "firstcut-decode-libraw"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
firstcut-decode = { workspace = true }
firstcut-meta = { workspace = true }

# `rsraw` vendors LibRaw 0.21.1 and compiles it with `cc`; its build script refuses MSVC
# outright, and its `-pthread` flag assumes a Unix toolchain. The dependency is therefore
# target-gated to the two platforms the backend supports today, and `backend()` returns
# `None` elsewhere (Windows falls back to the embedded JPEG; see the note in
# docs/v2-plan.md §6).
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
rsraw = "0.1.1"

# ── THE SINGLE UNSAFE CARVE-OUT OF THE WORKSPACE ──────────────────────────────
# docs/v2-plan.md §4.5, decision D3: the owner approved LibRaw (C++) for the v2
# native target. The workspace forbids `unsafe_code` everywhere; this table is the
# one permitted exception (the workspace layer check in xtask/src/layers.rs fails
# CI if any other crate carries its own [lints.rust] table). Unsafe code here is
# confined to FFI bindings and shadowed by checked, safe wrappers the rest of the
# ladder calls.
[lints.rust]
unsafe_code = "allow"
