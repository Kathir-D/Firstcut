[package]
name = "firstcut-decode-libraw"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
firstcut-decode = { workspace = true }
# LibRaw itself is added at M2 (docs/v2-plan.md §6); the crate exists now so the
# unsafe carve-out and the layers exception are in place before any bindings code.
# libraw-sys = "…" (M2)

# ── THE SINGLE UNSAFE CARVE-OUT OF THE WORKSPACE ──────────────────────────────
# docs/v2-plan.md §4.5, decision D3: the owner approved LibRaw (C++) for the v2
# native target. The workspace forbids `unsafe_code` everywhere; this table is the
# one permitted exception (the workspace layer check in xtask/src/layers.rs fails
# CI if any other crate carries its own [lints.rust] table). Unsafe code here is
# confined to FFI bindings and shadowed by checked, safe wrappers the rest of the
# ladder calls.
[lints.rust]
unsafe_code = "allow"
