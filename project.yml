# Owner: infra. XcodeGen spec; run `xcodegen` to generate Firstcut.xcodeproj (git-ignored).
name: Firstcut
options:
  bundleIdPrefix: com.kathird
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    GENERATE_INFOPLIST_FILE: YES
    DEVELOPMENT_TEAM: ""
    # The generated bindings import the C declarations of the Rust core from here
    # (App/Generated/FirstcutCoreFFI/module.modulemap, written by scripts/build-core.sh). Every
    # target needs it: Swift's explicit-module build planning resolves the transitive import.
    HEADER_SEARCH_PATHS: "$(SRCROOT)/App/Generated/FirstcutCoreFFI"
    SWIFT_INCLUDE_PATHS: "$(SRCROOT)/App/Generated/FirstcutCoreFFI"
targets:
  # The generated UniFFI bindings, packaged as a static framework so Swift code can
  # `import FirstcutCore` without the generated globals leaking into the app module.
  # Regenerated by scripts/build-core.sh; the Xcode pre-build phase below keeps it in step.
  FirstcutCore:
    type: framework
    platform: macOS
    sources:
      - path: App/Generated/FirstcutCore.swift
        optional: true
    dependencies:
      # Static Rust core. Linked, never embedded: there is no dynamic library to ship or sign.
      - framework: App/Generated/FirstcutCore.xcframework
        optional: true
        embed: false
        link: true
        codeSign: false
    settings:
      base:
        PRODUCT_NAME: FirstcutCore
        PRODUCT_BUNDLE_IDENTIFIER: com.kathird.firstcut.core
        MACH_O_TYPE: staticlib
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        DYLIB_INSTALL_NAME_BASE: ""
  Firstcut:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
        excludes:
          # The decode spike is a standalone benchmark, not app code. Its header says to run it
          # with `swiftc -D SPIKE … -o /tmp/firstcut-spike`, and that only works as a single-file
          # program: Swift parses the body of an inactive `#if` branch for *syntax*, and top-level
          # expressions are a syntax error in any file that is not `main.swift`. So the `#if SPIKE`
          # guard cannot make it inert inside the app target -- it has to be kept out of it.
          # Verified with: swiftc -typecheck -D SPIKE -swift-version 6 <file>
          - Pipeline/Spike/**
      - path: App/Resources
    dependencies:
      - target: FirstcutCore
        embed: false
        link: true
        codeSign: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kathird.firstcut
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Firstcut
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        # Kept in sync with the VERSION file by hand; scripts/build-app.sh and the release
        # workflow override both on the xcodebuild command line.
        MARKETING_VERSION: "0.0.0"
        CURRENT_PROJECT_VERSION: "1"
    preBuildScripts:
      # Keeps the bindings and the static core in step with the Rust sources. The script does its
      # own mtime check, so a Swift-only build costs a `find`.
      - name: Build Rust core if changed
        script: '"$SRCROOT/scripts/build-core-if-stale.sh"'
        basedOnDependencyAnalysis: false
  FirstcutUnitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: App/Tests/Unit
      # The committed exiftool dumps, copied into the test bundle. See the long note in
      # FixturePhotos.fixtureURL: the test host app is built inside the repo, which lives under
      # `~/Documents`, and a GUI app reading from there blocks on a TCC consent prompt that no one
      # is there to answer — so the test host hangs rather than failing. Reading from inside the
      # bundle sidesteps TCC entirely.
      - path: tests/fixtures/exiftool
        type: folder
        buildPhase: resources
      - path: tests/fixtures/meta
        type: folder
        buildPhase: resources
    dependencies:
      - target: Firstcut
      - target: FirstcutCore
  FirstcutIntegrationTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: App/Tests/Integration
      # Same reason as FirstcutUnitTests: the hosted app lives under `~/Documents` and blocks on a
      # TCC prompt if it reads from there. See the note in FixturePhotos.fixtureURL.
      - path: tests/fixtures/exiftool
        type: folder
        buildPhase: resources
      - path: tests/fixtures/meta
        type: folder
        buildPhase: resources
    dependencies:
      - target: Firstcut
      - target: FirstcutCore
  FirstcutPerformanceTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: App/Tests/Performance
      # `App/Tests/Performance/Support/FirstcutTestSupport.swift` was a byte-identical second copy
      # of the integration bundle's support file (REV-56 again: one concept, two definitions, and
      # the two drifted -- only one of them got the TCC fix, so the perf suite kept hanging). The
      # copy is deleted and this target compiles the single shared file instead.
      - path: App/Tests/Integration/Support
        type: group
        buildPhase: sources
      - path: tests/fixtures/exiftool
        type: folder
        buildPhase: resources
      - path: tests/fixtures/meta
        type: folder
        buildPhase: resources
    dependencies:
      - target: Firstcut
      - target: FirstcutCore
schemes:
  Firstcut:
    build:
      targets:
        Firstcut: all
    test:
      targets: [FirstcutUnitTests, FirstcutIntegrationTests, FirstcutPerformanceTests]
