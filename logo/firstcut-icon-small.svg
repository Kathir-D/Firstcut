<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Firstcut (small sizes)</title>
  <!-- Firstcut app icon. Apple macOS grid: 824x824 body at (100,100), transparent margin for the shadow.
       Burst of five frames fading from outline (back) to the photo (front); cyan-to-pink like Sonar. -->
  <defs>
    <linearGradient id="bg" x1="0.1" y1="0.05" x2="0.9" y2="0.95"><stop offset="0" stop-color="#5ac8fa"/><stop offset="1" stop-color="#f4a6b8"/></linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e3e9f7"/></linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <filter id="bodyShadow" x="-15%" y="-15%" width="130%" height="135%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/></filter>
    <filter id="glyphShadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#2b3a6b" flood-opacity=".30"/></filter>
    <clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#bodyShadow)"/>
  <rect x="100" y="100" width="824" height="412" fill="url(#gloss)" clip-path="url(#body)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="3"/>
  <g filter="url(#glyphShadow)" stroke-linejoin="round" stroke-linecap="round">
    <rect x="222.0" y="277.0" width="440" height="330" rx="56" fill="url(#frame)" fill-opacity="0.00" stroke="#fff" stroke-width="26" stroke-opacity="0.35"/>
    <rect x="292.0" y="347.0" width="440" height="330" rx="56" fill="url(#frame)" fill-opacity="0.50" stroke="#fff" stroke-width="26" stroke-opacity="0.68"/>
    <rect x="362.0" y="417.0" width="440" height="330" rx="56" fill="url(#frame)" fill-opacity="1.00" stroke="#fff" stroke-width="26" stroke-opacity="1.00"/>
    <circle cx="678.8" cy="522.6" r="33.0" fill="url(#bg)" stroke="none"/>
    <path d="M406.0 687.6L524.8 562.2L612.8 641.4L670.0 598.5L758.0 687.6Z" fill="url(#bg)" stroke="none"/>
  </g>
</svg>
